[project]
name = "flake8-bas"
version = "1.1.0"
description = "Flake8 extension that checks for blank lines around (compound) statements."
authors = [{ name = "Tomas Mrozek", email = "tm@nohup.run" }]
maintainers = [{ name = "Tomas Mrozek", email = "tm@nohup.run" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    'Environment :: Console',
    'Framework :: Flake8',
    'Operating System :: OS Independent',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Quality Assurance',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    "flake8>=3.8.0",
    "setuptools",
]

[project.urls]
Repository = "https://github.com/ts-mk/flake8-bas/"
Documentation = "https://github.com/ts-mk/flake8-bas/blob/master/README.md"

[project.entry-points."flake8.extension"]
BAS = "flake8_bas:StatementChecker"

[dependency-groups]
dev = [
    "black==25.12.0",
    "isort>=7.0.0,<8.0.0",
    "pre-commit>=4.5.1,<5.0.0",
    "pycln>=2.4.0,<3.0.0",
]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]
ci = [
    "click>=8.1.0,<9.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[tool.black]
force-exclude = ".*tests/fixtures/.*"
line-length = 88
skip-numeric-underscore-normalization = true

[tool.interrogate]
color = true
exclude = ["tests", ".local"]
fail-under = 100
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = true
ignore-nested-functions = true
ignore-private = false
ignore-property-decorators = true
ignore-semiprivate = false
quiet = false
verbose = 2

[tool.isort]
extend_skip_glob = [".local/*", "tests/fixtures/*"]
filter_files = true
line_length = 88
no_lines_before = ["LOCALFOLDER"]
profile = "black"

[tool.pycln]
exclude = "tests/.*"
