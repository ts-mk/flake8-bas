name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version to be released
        required: true
        type: choice
        default: skip
        options:
          - skip
          - patch
          - minor
          - major

env:
  UV_VERSION: '0.11.21'
  PYTHON_VERSION: '3.14'
  SELF: release.yml
  UTILS: ./.github/workflows/utils.py

jobs:
  release:
    name: Version update & release
    runs-on: ubuntu-latest
    steps:
      - name: Dump workflow context
        uses: crazy-max/ghaction-dump-context@v1.2.1

      - name: Git checkout
        uses: actions/checkout@v4

      - name: uv installation
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Package installation
        run: uv sync --locked --no-group dev --no-group test

      - name: Set new package version
        if: github.event.inputs.version != 'skip'
        run: |
          PART="${{ github.event.inputs.version }}"
          VERSION=$(uv version --short)

          # Releasing a pre-release (e.g. 1.2.0a1) finalises it (1.2.0) when the
          # requested part is already bumped, otherwise the part is bumped.
          if [[ "$VERSION" =~ [a-z] ]]; then \
            STABLE=$(uv version --dry-run --short --bump stable); \
            IFS=. read -r _ MINOR PATCH <<< "$STABLE"; \
            if [[ "$PART" == "patch" ]] || \
               [[ "$PART" == "minor" && "$PATCH" == "0" ]] || \
               [[ "$PART" == "major" && "$MINOR" == "0" && "$PATCH" == "0" ]]; then \
              uv version --no-sync "$STABLE"; \
            else \
              uv version --no-sync --bump "$PART"; \
            fi; \
          else \
            uv version --no-sync --bump "$PART"; \
          fi
          echo "NEW version: $(uv version --short)"

      - name: Version validation
        run: |
          VERSION=$(uv version --short)

          if [[ "$VERSION" =~ [a-z] ]]; then \
            echo "ERROR: Pre-release version detected."; \
            exit 1; \
          fi

      - name: Set version in CHANGELOG.md
        run: uv run --no-sync ${{ env.UTILS }} write-changelog-release --version="$(uv version --short)"

      - name: Git commit new version
        uses: stefanzweifel/git-auto-commit-action@v4.15.4
        with:
          commit_author: GA bot <noreply@github.com>
          commit_message: Version update
          commit_user_email: noreply@github.com
          commit_user_name: GA bot
          file_pattern: pyproject.toml uv.lock CHANGELOG.md
          skip_checkout: true

      - name: Set release data
        id: release
        run: >-
          uv run --no-sync ${{ env.UTILS }} set-release-data
          --version="$(uv version --short)"
          --commit=$(git rev-parse HEAD)

      - name: Create release
        uses: ncipollo/release-action@v1.11.1
        with:
          allowUpdates: false
          commit: ${{ steps.release.outputs.commit }}
          tag: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.title }}
          body: ${{ steps.release.outputs.notes }}
          token: ${{ secrets.GA_TOKEN }}

      - name: Publish package to PyPI
        id: run
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv build --no-sources
          uv publish
