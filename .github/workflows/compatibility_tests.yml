name: Compatibility tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1,5'

concurrency:
  group: compatibility_tests-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_RESULT: ./coverage.xml
  UV_VERSION: '0.11.21'
  PACKAGE_NAME: 'flake8_bas'
  SELF: tests.yml
  UTILS: ./.github/workflows/utils.py

jobs:
  compatibility:
    name: Latest Flake8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Dump workflow context
        uses: crazy-max/ghaction-dump-context@v1

      - name: Git checkout
        uses: actions/checkout@v4

      - name: Setup of a local directory
        run: mkdir ./.local

      - name: uv installation
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Package installation
        run: |
          uv sync --locked --no-group dev --no-group test
          uv pip install --upgrade flake8
          echo -e "\nFlake8 version: $(uv run --no-sync flake8 --version)"

      - name: Run
        run: >-
          uv run --no-sync flake8 --isolated --select=BAS ./tests/fixtures/*/* |
          uv run --no-sync ${{ env.UTILS }} assert-error-count --directory=./tests/fixtures/invalid
