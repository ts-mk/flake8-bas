name: Code coverage

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'flake8_bas/**'

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_RESULT: ./coverage.xml
  UV_VERSION: '0.11.21'
  PYTHON_VERSION: '3.14'
  PACKAGE_NAME: 'flake8_bas'
  SELF: coverage.yml
  UTILS: ./.github/workflows/utils.py

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Dump workflow context
        uses: crazy-max/ghaction-dump-context@v1

      - name: Git checkout
        uses: actions/checkout@v4

      - name: uv installation
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Package installation
        run: uv sync --locked --no-group dev

      - name: Run
        run: >-
          uv run --no-sync pytest
          --tb=short
          --cov=${{ env.PACKAGE_NAME }}
          --cov-report=xml:${{ env.COVERAGE_RESULT }}
          --cov-report=term
          ./tests/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ${{ env.COVERAGE_RESULT }}

      - name: Store the test coverage result
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ env.COVERAGE_RESULT }}
          retention-days: 90

      - name: Add coverage into job's summary
        run: >-
          uv run --no-sync ${{ env.UTILS }} coverage-summary
          --coverage_file="${GITHUB_WORKSPACE}/${{ env.COVERAGE_RESULT }}"
