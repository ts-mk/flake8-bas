name: Build & deployment

on:
  workflow_dispatch:
    inputs:
      version-update:
        description: Update version before deployment
        required: false
        type: choice
        default: skip
        options:
          - skip
          - prepatch
          - preminor
          - premajor

env:
  UV_VERSION: '0.11.21'
  PYTHON_VERSION: '3.14'
  SELF: deployment.yml

jobs:
  build:
    name: Build & deployment
    runs-on: ubuntu-latest
    steps:
      - name: Dump workflow context
        uses: crazy-max/ghaction-dump-context@v1

      - name: Branch validation
        if: github.ref_protected == 'true'
        run: |
          echo 'ERROR: Manual deployment cannot be performed on a protected branch.'
          exit 1

      - name: Git checkout
        uses: actions/checkout@v4

      - name: uv installation
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Version update
        id: version-update
        if: github.event.inputs.version-update != 'skip'
        run: |
          VERSION=$(uv version --short)

          if [[ "$VERSION" =~ [a-z] ]]; then \
            uv version --no-sync --bump alpha; \
          else \
            PART="${{ github.event.inputs.version-update }}"; \
            uv version --no-sync --bump "${PART#pre}" --bump alpha; \
          fi
          if [[ "$VERSION" == $(uv version --short) ]]; then \
            echo "ERROR: Updating package version failed."; \
            exit 1; \
          fi

      - name: Version validation
        run: |
          VERSION=$(uv version --short)

          if ! [[ "$VERSION" =~ [a-z] ]]; then \
            echo "ERROR: Non pre-release version detected."; \
            exit 1; \
          fi

      - name: Run
        id: run
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          uv build --no-sources
          uv publish

      - name: Git commit new version
        if: >-
          (
            github.event.inputs.version-update != 'skip' &&
            steps.version-update.outcome == 'success'
          )
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_author: GA bot <noreply@github.com>
          commit_message: Update of the package version
          commit_user_email: noreply@github.com
          commit_user_name: GA bot
          file_pattern: pyproject.toml uv.lock
          skip_checkout: true
