name: Quality checks

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_RESULT: ./coverage.xml
  UV_VERSION: '0.11.21'
  # This Python version must match the one in .pre-commit-config.yaml
  PYTHON_VERSION: '3.14'
  PACKAGE_NAME: 'flake8_bas'
  SELF: tests.yml
  UTILS: ./.github/workflows/utils.py

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Dump workflow context
        uses: crazy-max/ghaction-dump-context@v1

      - name: Git checkout
        uses: actions/checkout@v4

      - name: Result cache
        id: result-cache
        uses: actions/cache@v4
        with:
          path: ./.local/result_cache
          key: >-
            ${{ github.job }}-result-${{ env.PYTHON_VERSION }}-${{ github.ref }}-${{
              hashFiles(
                format('.github/workflows/{0}', env.SELF),
                format('{0}/**.py', env.PACKAGE_NAME),
                'tests/**',
                'uv.lock',
                '.pre-commit-config.yaml',
                'setup.cfg'
              )
            }}

      - name: Python setup
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        uses: pre-commit/action@v3.0.0

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Dump workflow context
        uses: crazy-max/ghaction-dump-context@v1

      - name: Git checkout
        uses: actions/checkout@v4

      - name: Result cache
        id: result-cache
        uses: actions/cache@v4
        with:
          path: ./.local/result_cache
          key: >-
            ${{ github.job }}-result-${{ env.PYTHON_VERSION }}-${{ github.ref }}-${{
              hashFiles(
                format('.github/workflows/{0}', env.SELF),
                format('{0}/**.py', env.PACKAGE_NAME),
                'tests/**',
                'uv.lock'
              )
            }}

      - name: Setup of a local directory
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: mkdir ./.local && touch ./.local/result_cache

      - name: uv installation
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Package installation
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: uv sync --locked --no-group dev

      - name: Run
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: >-
          uv run --no-sync pytest
          --tb=short
          --cov=${{ env.PACKAGE_NAME }}
          --cov-report=xml:${{ env.COVERAGE_RESULT }}
          --cov-report=term
          ./tests/

      - name: Store the test coverage result
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ env.COVERAGE_RESULT }}
          retention-days: 90

      - name: Add coverage into job's summary
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: >-
          uv run --no-sync ${{ env.UTILS }} coverage-summary
          --coverage_file="${GITHUB_WORKSPACE}/${{ env.COVERAGE_RESULT }}"

  compatibility:
    name: Compatibility tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Version 5.0.0 of Flake8 is buggy and would output duplicate errors
        flake8: ['3.8.0', '4.0.0', '5.0.1', '6.0.0', '7.0.0', '*']
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - flake8: '3.8.0'
            python: '3.12'
          - flake8: '4.0.0'
            python: '3.12'
          - flake8: '3.8.0'
            python: '3.13'
          - flake8: '4.0.0'
            python: '3.13'
          - flake8: '3.8.0'
            python: '3.14'
          - flake8: '4.0.0'
            python: '3.14'
    steps:
      - name: Dump workflow context
        uses: crazy-max/ghaction-dump-context@v1

      - name: Git checkout
        uses: actions/checkout@v4

      - name: Result cache
        id: result-cache
        uses: actions/cache@v4
        with:
          path: ./.local/result_cache
          key: >-
            ${{ github.job }}-result-${{ matrix.python }}-${{ matrix.flake8 }}-${{ github.ref }}-${{
              hashFiles(
                format('.github/workflows/{0}', env.SELF),
                format('{0}/**.py', env.PACKAGE_NAME),
                'tests/**',
                'uv.lock'
              )
            }}

      - name: Setup of a local directory
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: mkdir ./.local && touch ./.local/result_cache

      - name: uv installation
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Package installation
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: |
          uv sync --locked --no-group dev --no-group test
          if [[ "${{ matrix.flake8 }}" == "*" ]]; then SPEC="flake8"; else SPEC="flake8==${{ matrix.flake8 }}"; fi
          uv pip install --upgrade "$SPEC"
          echo -e "\nFlake8 version: $(uv run --no-sync flake8 --version)"

      - name: Run
        if: (steps.result-cache.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch')
        run: >-
          uv run --no-sync flake8 --isolated --select=BAS ./tests/fixtures/*/* |
          uv run --no-sync ${{ env.UTILS }} assert-error-count --directory=./tests/fixtures/invalid
